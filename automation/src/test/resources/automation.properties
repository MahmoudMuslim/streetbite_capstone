# =============================================================================
# StreetBite automation configuration
# =============================================================================
# Resolution order (first match wins):
#   1. -D<key>=<value>   (Maven system property)
#   2. <KEY>             (environment variable, upper-cased, dots -> underscores)
#   3. this file
# =============================================================================

# ---- Application ------------------------------------------------------------
app.package = com.example.streetbite_capstone
app.activity = .MainActivity
app.apk = ../streetbite_capstone/build/app/outputs/flutter-apk/app-release.apk

# ---- Appium -----------------------------------------------------------------
appium.server = http://127.0.0.1:4723/wd/hub
appium.platform = Android

# Emulator (Android Studio AVD):
appium.device = Android Emulator

# Real handset — replace the value above with the serial from `adb devices`,
# e.g.  appium.device = R5CT30ABCDE
# Appium 2 resolves a physical device by serial as well.

appium.reset = true
appium.grantPermissions = true

# Implicit waits stay at 0 on purpose: with Appium they hide real timing bugs
# and interact badly with element caching. Explicit waits live in the tests.
appium.implicitWait = 0
appium.explicitWait = 15

# ---- Test data --------------------------------------------------------------
# Seeded by the app on first launch; see core/constants/app_constants.dart.
user.email = yasmine@streetbite.app
user.password = StreetBite123

# Guaranteed not to exist in Firebase.
user.unknownEmail = ghost@streetbite.app
user.wrongPassword = WrongPass1

# ---- Evidence ---------------------------------------------------------------
evidence.dir = target/screenshots