org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- StreetBite build settings ----------------------------------------------
# Kotlin's memory-mapped incremental caches (.tab files) cannot be closed on
# Windows when a virus scanner or the Windows Search index holds a handle, which
# fails the build with "Could not close incremental caches". Disabling
# incremental Kotlin compilation sidesteps the issue entirely; the cost is a few
# extra seconds per plugin module.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# StreetBite targets a single ABI for the beta APK (see README, App
# Distribution), so splitting per-ABI only multiplies build time.
android.nonTransitiveRClass=true
# R8's optimised resource shrinking requires non-final resource IDs.
android.nonFinalResIds=true
