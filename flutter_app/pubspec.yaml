name: streetbite_capstone
description: "StreetBite - Hyperlocal Food Discovery & Ordering App."
publish_to: 'none'

# App version used for the Firebase App Distribution release build.
version: 1.0.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management (Bloc / Cubit pattern) ---
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # --- Dependency Injection ---
  get_it: ^8.0.3

  # --- Networking & local caching ---
  dio: ^5.7.0
  shared_preferences: ^2.3.3

  # --- Firebase (Auth / Firestore) ---
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.6

  # --- Device capabilities ---
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  local_auth: ^3.0.2
  local_auth_android: ^2.0.4
  device_info_plus: ^11.2.0

  # --- Localization ---
  intl: any

  # --- UI helpers ---
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
